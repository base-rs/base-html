name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: clippy, llvm-tools-preview, rustfmt
          cache-shared-key: coverage-bake-launcher-v2
      - name: Install Bake launcher
        run: cargo install bake --locked
      - name: Install coverage tool
        run: cargo install cargo-llvm-cov --locked
      - run: cargo fmt --all -- --check
      - name: Check the library without HTTP integration
        run: cargo test --package base-web-html --no-default-features --locked
      - name: Build the benchmark workload without the benchmark runner, as preparation does
        run: cargo clippy --package base-web-html-benchmark-rendering --bins --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests and require complete source-region coverage
        run: cargo bake --locked test:coverage --all-targets true
      - name: Include HTTP streaming in source-region coverage
        run: cargo bake --locked test:coverage --all-targets true --all-features true

  test-result:
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require successful tests and coverage
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
