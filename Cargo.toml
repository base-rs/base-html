[package]
name = "base-web-html"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Compiled HTML templates with escaped, writer-based rendering"
repository = "https://github.com/base-rs/base-web-html"
readme = "readme.md"
rust-version = "1.88"
keywords = ["html", "template", "async", "streaming", "escaping"]
categories = ["template-engine", "web-programming", "asynchronous"]
include = ["src/**", "context/**", "Cargo.toml", "readme.md", "license.md", "releases.md"]

[workspace]
members = ["macros", "bake", "benchmarks/rendering"]
resolver = "3"

[workspace.metadata.bake.release]
reviewers = ["base-rs/maintainers"]

[dependencies]
base-web-html-macros = { version = "=0.2.0", path = "macros" }
bytes = { version = "1.12.1", optional = true }
futures-io = "0.3.34"
http-body = { version = "1.1.0", optional = true }

[dev-dependencies]
futures = { version = "0.3.34", features = ["executor"] }
trybuild = "1"

[[bench]]
name = "render"
harness = false

[features]
http-body = ["dep:bytes", "dep:http-body"]

[[example]]
name = "streaming"
required-features = ["http-body"]

# Document the optional HTTP response body too.
[package.metadata.docs.rs]
all-features = true
